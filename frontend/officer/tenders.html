<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tenders — GOVNEXA</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/variables.css"><link rel="stylesheet" href="../css/reset.css">
  <link rel="stylesheet" href="../css/global.css"><link rel="stylesheet" href="../css/layout.css">
  <link rel="stylesheet" href="../css/components.css"><link rel="stylesheet" href="../css/tables.css">
  <link rel="stylesheet" href="../css/forms.css"><link rel="stylesheet" href="../css/dashboard.css">
  <link rel="stylesheet" href="../css/animations.css"><link rel="stylesheet" href="../css/responsive.css">
</head>
<body>
<div class="page-container page-enter" id="root">
  <div class="page-header">
    <div class="page-title-group">
      <h1 class="page-title">Tenders</h1>
      <p class="page-subtitle">Manage and monitor all procurement tenders</p>
    </div>
    <div class="page-actions">
      <button class="btn btn-secondary" onclick="Toast.info('Filters','Advanced filter panel coming soon')">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75"><polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"/></svg>
        Filters
      </button>
      <a href="create-tender.html" class="btn btn-primary">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        Create Tender
      </a>
    </div>
  </div>

  <!-- Status Filters -->
  <div class="filter-bar" id="status-filters">
    <button class="filter-btn active" data-filter="all">All <span style="margin-left:4px;opacity:0.6">(6)</span></button>
    <button class="filter-btn" data-filter="active">Active</button>
    <button class="filter-btn" data-filter="draft">Draft</button>
    <button class="filter-btn" data-filter="under_review">Under Review</button>
    <button class="filter-btn" data-filter="closed">Closed</button>
    <button class="filter-btn" data-filter="awarded">Awarded</button>
  </div>

  <!-- Tender Table -->
  <div class="table-container">
    <div class="table-toolbar">
      <span class="table-toolbar-title">All Tenders</span>
      <div class="table-search">
        <span class="table-search-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg></span>
        <input type="search" class="table-search-input" id="tender-search" placeholder="Search tenders…">
      </div>
      <div class="select-wrapper" style="max-width:140px">
        <select class="form-select" id="sort-select" style="height:34px;font-size:var(--text-xs)">
          <option value="created">Newest First</option>
          <option value="deadline">Deadline</option>
          <option value="bidders">Most Bidders</option>
        </select>
      </div>
    </div>
    <div class="table-wrapper">
      <table class="data-table" id="tender-table">
        <thead>
          <tr>
            <th>Tender ID</th>
            <th>Title</th>
            <th>Department</th>
            <th>Deadline</th>
            <th>Bidders</th>
            <th>Value</th>
            <th>Status</th>
            <th style="width:120px">Actions</th>
          </tr>
        </thead>
        <tbody id="tender-tbody"></tbody>
      </table>
    </div>
    <div class="table-footer">
      <span class="table-footer-count" id="tender-count">Showing 6 tenders</span>
      <div class="pagination" id="tender-pagination"></div>
    </div>
  </div>
</div>

<script src="../js/utils.js"></script>
<script src="../js/api.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/notifications.js"></script>
<script src="../js/components.js"></script>
<script src="../js/navigation.js"></script>
<script src="../js/officer.js"></script>
<script>
  if (!localStorage.getItem('govnexa_token')) window.location.href = '../login.html';
  Navigation.injectShell('officer', 'Tenders', [{ label: 'Tenders' }]);

  let currentFilter = 'all';

  function renderTenders(filter = 'all', search = '') {
    let data = DemoData.TENDERS;
    if (filter !== 'all') data = data.filter(t => t.status === filter);
    if (search) data = data.filter(t => t.title.toLowerCase().includes(search) || t.id.toLowerCase().includes(search) || t.dept.toLowerCase().includes(search));

    document.getElementById('tender-count').textContent = `Showing ${data.length} tender${data.length !== 1 ? 's' : ''}`;

    if (!data.length) {
      document.getElementById('tender-tbody').innerHTML = `<tr><td colspan="8" style="padding:var(--space-12);text-align:center;color:var(--text-muted)">No tenders found</td></tr>`;
      return;
    }

    document.getElementById('tender-tbody').innerHTML = data.map(t => {
      const deadline = new Date(t.deadline);
      const now = new Date();
      const diff = Math.floor((deadline - now) / 86400000);
      const deadlineColor = diff < 0 ? 'var(--accent-coral)' : diff < 3 ? 'var(--accent-amber)' : 'var(--text-secondary)';
      return `
      <tr class="animate-fadeIn">
        <td class="mono" data-label="ID"><code>${t.id}</code></td>
        <td data-label="Title">
          <div style="font-weight:var(--fw-semibold);color:var(--text-primary)">${t.title}</div>
        </td>
        <td data-label="Department" class="muted">${t.dept}</td>
        <td data-label="Deadline" style="color:${deadlineColor};font-family:var(--font-mono);font-size:var(--text-xs)">${Utils.formatDate(t.deadline)}${diff >= 0 && diff < 5 ? ` <span class="badge badge-review" style="margin-left:4px">${diff}d left</span>` : ''}</td>
        <td data-label="Bidders">
          <div style="display:flex;align-items:center;gap:var(--space-2)">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="var(--text-muted)" stroke-width="1.75"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
            <span>${t.bidders}</span>
          </div>
        </td>
        <td data-label="Value" style="font-family:var(--font-mono);font-size:var(--text-xs);color:var(--text-secondary)">${t.value}</td>
        <td data-label="Status"><span class="badge ${Utils.statusToBadge(t.status)}">${Utils.statusLabel(t.status).replace(/[✓⚠✕—●○]/g,'').trim()}</span></td>
        <td data-label="Actions">
          <div class="row-actions">
            <a href="requirements.html?id=${t.id}" class="row-action-btn" data-tooltip="Requirements" aria-label="View requirements">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
            </a>
            <a href="bidders.html?tender=${t.id}" class="row-action-btn" data-tooltip="Bidders" aria-label="View bidders">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/></svg>
            </a>
            <button class="row-action-btn" data-tooltip="More options" onclick="event.stopPropagation()" aria-label="More">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/><circle cx="5" cy="12" r="1"/></svg>
            </button>
          </div>
        </td>
      </tr>`;
    }).join('');
  }

  function updateFilterCounts() {
    const all = DemoData.TENDERS;
    const allBtn = document.querySelector('.filter-btn[data-filter="all"]');
    if (allBtn) allBtn.innerHTML = `All <span style="margin-left:4px;opacity:0.6">(${all.length})</span>`;
  }

  // Filter buttons
  document.querySelectorAll('.filter-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      currentFilter = btn.dataset.filter;
      renderTenders(currentFilter, document.getElementById('tender-search').value.trim().toLowerCase());
    });
  });

  // Search
  document.getElementById('tender-search').addEventListener('input', Utils.debounce((e) => {
    renderTenders(currentFilter, e.target.value.trim().toLowerCase());
  }, 200));

  updateFilterCounts();
  renderTenders();
</script>
</body>
</html>
