<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>User Management — GOVNEXA</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/variables.css"><link rel="stylesheet" href="../css/reset.css">
  <link rel="stylesheet" href="../css/global.css"><link rel="stylesheet" href="../css/layout.css">
  <link rel="stylesheet" href="../css/components.css"><link rel="stylesheet" href="../css/tables.css">
  <link rel="stylesheet" href="../css/forms.css"><link rel="stylesheet" href="../css/dashboard.css">
  <link rel="stylesheet" href="../css/animations.css"><link rel="stylesheet" href="../css/responsive.css">
</head>
<body>
<div class="page-container page-enter" id="root">
  <div class="page-header">
    <div class="page-title-group">
      <h1 class="page-title">User Management & Access Control</h1>
      <p class="page-subtitle">Configure role-based access permissions (RBAC) for Procurement Officers, Bidders, and System Admins</p>
    </div>
    <div class="page-actions">
      <button class="btn btn-primary" onclick="openAddUserModal()">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        Provision New User
      </button>
    </div>
  </div>

  <!-- Filter Bar -->
  <div class="filter-bar" id="user-filters">
    <button class="filter-btn active" data-role="all">All Users (5)</button>
    <button class="filter-btn" data-role="officer">Procurement Officers</button>
    <button class="filter-btn" data-role="bidder">Enterprise Bidders</button>
    <button class="filter-btn" data-role="admin">System Administrators</button>
  </div>

  <!-- User Table -->
  <div class="table-container">
    <div class="table-toolbar">
      <span class="table-toolbar-title">Active Platform Identities</span>
      <div class="table-search">
        <span class="table-search-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg></span>
        <input type="search" class="table-search-input" id="user-search" placeholder="Search name, email, department...">
      </div>
    </div>

    <div class="table-wrapper">
      <table class="data-table">
        <thead>
          <tr>
            <th>User & Identity</th>
            <th>Email</th>
            <th>Role</th>
            <th>Department / Organization</th>
            <th>Last Active</th>
            <th>Status</th>
            <th style="width:120px">Actions</th>
          </tr>
        </thead>
        <tbody id="user-tbody"></tbody>
      </table>
    </div>
  </div>
</div>

<!-- Provision User Modal -->
<div class="modal-backdrop" id="user-modal" style="display:none;">
  <div class="modal" style="max-width: 540px;">
    <div class="modal-header">
      <h3 class="modal-title">Provision Platform User</h3>
      <button class="btn btn-ghost" onclick="closeUserModal()">&times;</button>
    </div>
    <div class="modal-body">
      <div class="form-group" style="margin-bottom:var(--space-3);">
        <label class="form-label required">Full Name</label>
        <input type="text" class="form-input" id="inp-u-name" placeholder="e.g. Ramesh Chandra">
      </div>
      <div class="form-group" style="margin-bottom:var(--space-3);">
        <label class="form-label required">Official Email Address</label>
        <input type="email" class="form-input" id="inp-u-email" placeholder="e.g. ramesh.c@gov.in">
      </div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:var(--space-3);margin-bottom:var(--space-3);">
        <div class="form-group">
          <label class="form-label required">Role</label>
          <select class="form-select" id="inp-u-role">
            <option value="officer">Procurement Officer</option>
            <option value="bidder">Bidder Supplier</option>
            <option value="admin">System Administrator</option>
          </select>
        </div>
        <div class="form-group">
          <label class="form-label required">Department / Org</label>
          <input type="text" class="form-input" id="inp-u-dept" placeholder="e.g. Ministry of Power">
        </div>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-secondary" onclick="closeUserModal()">Cancel</button>
      <button class="btn btn-primary" onclick="saveNewUser()">Provision User</button>
    </div>
  </div>
</div>

<script src="../js/utils.js"></script>
<script src="../js/api.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/notifications.js"></script>
<script src="../js/components.js"></script>
<script src="../js/navigation.js"></script>
<script src="../js/admin.js"></script>
<script>
  if (!localStorage.getItem('govnexa_token')) window.location.href = '../login.html';
  Navigation.injectShell('admin', 'Users', [{ label: 'User Management' }]);

  let users = [...AdminData.USERS];

  function renderUsers(role = 'all', query = '') {
    let list = users;
    if (role !== 'all') list = list.filter(u => u.role === role);
    if (query) {
      const q = query.toLowerCase();
      list = list.filter(u => u.name.toLowerCase().includes(q) || u.email.toLowerCase().includes(q) || u.dept.toLowerCase().includes(q));
    }

    const tbody = document.getElementById('user-tbody');
    tbody.innerHTML = list.map(u => {
      const roleBadge = u.role === 'admin' ? 'badge-processing' : u.role === 'officer' ? 'badge-verified' : 'badge-pending';

      return `
        <tr>
          <td>
            <div style="font-weight:var(--fw-semibold);color:var(--text-primary);">${u.name}</div>
            <div style="font-size:11px;color:var(--text-muted);">${u.id}</div>
          </td>
          <td style="font-family:var(--font-mono);font-size:var(--text-xs);">${u.email}</td>
          <td><span class="badge ${roleBadge}">${u.role.toUpperCase()}</span></td>
          <td style="font-size:var(--text-xs);color:var(--text-secondary);">${u.dept}</td>
          <td style="font-size:var(--text-xs);color:var(--text-muted);">${u.lastLogin}</td>
          <td><span class="badge badge-verified">ACTIVE</span></td>
          <td>
            <button class="btn btn-ghost" style="padding:4px 8px;font-size:var(--text-xs);" onclick="Toast.info('User Action', 'Editing permissions for ${u.name}')">
              Edit
            </button>
          </td>
        </tr>
      `;
    }).join('');
  }

  document.getElementById('user-filters').addEventListener('click', e => {
    if (e.target.classList.contains('filter-btn')) {
      document.querySelectorAll('#user-filters .filter-btn').forEach(b => b.classList.remove('active'));
      e.target.classList.add('active');
      renderUsers(e.target.getAttribute('data-role'), document.getElementById('user-search').value);
    }
  });

  document.getElementById('user-search').addEventListener('input', e => {
    renderUsers('all', e.target.value);
  });

  function openAddUserModal() {
    document.getElementById('user-modal').style.display = 'flex';
  }

  function closeUserModal() {
    document.getElementById('user-modal').style.display = 'none';
  }

  function saveNewUser() {
    const name = document.getElementById('inp-u-name').value;
    const email = document.getElementById('inp-u-email').value;
    if (!name || !email) {
      Toast.error('Validation Error', 'Name and email are required.');
      return;
    }
    users.push({
      id: 'USR-' + String(users.length + 1).padStart(3, '0'),
      name: name,
      email: email,
      role: document.getElementById('inp-u-role').value,
      dept: document.getElementById('inp-u-dept').value || 'General Org',
      status: 'active',
      lastLogin: 'Never'
    });
    closeUserModal();
    renderUsers();
    Toast.success('User Provisioned', `${name} added to access control matrix.`);
  }

  renderUsers();
</script>
</body>
</html>
